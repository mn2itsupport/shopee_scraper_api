{% macro logo_mark(stroke="#0e1a21") -%}
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ stroke }}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M4 12h16M4 17h7"/></svg>
{%- endmacro %}

{% macro icon(name) -%}
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == "overview" %}<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
{% elif name == "playground" %}<path d="M8 5l11 7-11 7z"/>
{% elif name == "jobs" %}<path d="M4 6h16M4 12h16M4 18h10"/>
{% elif name == "keys" %}<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>{% endif %}
</svg>
{%- endmacro %}

{% macro check() -%}
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3ddbb0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:2px"><path d="M5 12l5 5 9-10"/></svg>
{%- endmacro %}
